[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-multi"
version = "1.1.0"
description = "Google Antigravity (agy) multi-account manager, concurrent isolation runner, and usage dashboard on Linux"
readme = "README.md"
authors = [{ name = "agy-multi contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["antigravity", "agy", "google-ai", "multi-account", "dashboard", "token-usage", "cli", "linux"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.scripts]
agy-multi = "agy_multi.cli:main"
gemini-switch = "agy_multi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agy_multi*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

